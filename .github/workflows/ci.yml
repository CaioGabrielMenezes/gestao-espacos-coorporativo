name: CI

# Roda a cada push e em todo pull request para a main. O objetivo é simples e
# deliberado: garantir que uma mudança passa por verificação antes de ser
# considerada pronta — não construir infraestrutura elaborada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Suíte completa
        run: python -m pytest -q

      # Os metamórficos são entregável obrigatório do trabalho. Rodá-los de
      # novo, isolados, faz a saída do CI mostrar explicitamente que as quatro
      # propriedades foram verificadas.
      - name: Testes metamórficos (entregável obrigatório)
        run: python -m pytest tests/metamorphic -v --no-header

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Testes de componente
        run: npm test
      - name: Build de produção
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Sobe backend e frontend de verdade: é a única etapa que pega quebra de
    # contrato entre as duas pontas. Roda depois das outras porque, se a base
    # já está quebrada, o E2E só repetiria a mesma notícia mais devagar.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar navegador
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # A configuração do Playwright sobe os dois servidores sozinha, semeando
      # um SQLite descartável antes.
      - name: Rodar E2E
        working-directory: frontend
        run: npx playwright test

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
